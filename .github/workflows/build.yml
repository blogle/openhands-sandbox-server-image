name: Build and publish sandbox-server image

on:
  workflow_dispatch:
    inputs:
      sandbox_server_ref:
        description: "Git ref (tag/SHA) of OpenHands/sandbox-server to build"
        required: true
        default: "f19f9e0d88272bb393e39e8cbcb78e3e8aa633a3"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: blogle/openhands-sandbox-server

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Check out OpenHands/sandbox-server
        uses: actions/checkout@v4
        with:
          repository: OpenHands/sandbox-server
          ref: ${{ inputs.sandbox_server_ref }}
          path: sandbox-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.sandbox_server_ref }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox-server
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            OPENHANDS_BUILD_VERSION=${{ inputs.sandbox_server_ref }}
